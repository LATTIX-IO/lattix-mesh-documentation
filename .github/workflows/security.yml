name: Security and threat model

on:
  pull_request:
    branches:
      - v0.1.0
      - main
  push:
    branches:
      - v0.1.0
      - main
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Threat model and pentest gate
    permissions:
      contents: read
      security-events: write
    uses: LATTIX-IO/lattix-cicd-pentest/.github/workflows/ci-security-gate.yml@cfbb7e5c5e02211f8b93f229df604ea4b09e2de0
    with:
      source-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      target-url: ${{ github.event_name == 'schedule' && vars.PENTEST_TARGET_URL || '' }}
      openapi-url: ${{ github.event_name == 'schedule' && vars.PENTEST_OPENAPI_URL || '' }}
      require-active-pentest: ${{ github.event_name == 'schedule' && vars.PENTEST_REQUIRED == 'true' }}
